<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Loop Recorder</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d25"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="1" stop-color="#f0362a"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ff7a63"/>
      <stop offset="1" stop-color="#ec3326"/>
    </radialGradient>
  </defs>
  <!-- Fondo tipo icono de app -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="3"/>
  <!-- El "loop": anillo abierto de 300° -->
  <path d="M396.95 204.7 A150 150 0 1 1 282.05 108.28" fill="none" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"/>
  <!-- La burbuja de cámara, en el hueco del anillo -->
  <circle cx="352.4" cy="141.1" r="25" fill="#ffb547"/>
  <!-- Botón de grabar -->
  <circle cx="256" cy="256" r="68" fill="url(#dot)"/>
</svg>
